name: Go

on:
  push:
    # OCTO-FORK: 把集成分支 v1 接进 CI — see dev-docs-usdable/需求/20260911/需求基线.md §5.6 `V-62`
    #
    # v1 is the product integration branch and PRs land there by local merge
    # followed by a direct push — so without it here, no guard, no Go test and
    # no frontend check ever runs on the branch everything ships from (V-62;
    # V-61 is what landed in that blind spot).
    branches: [main, v1]
  pull_request:
  workflow_dispatch:

# Least-privilege default: jobs only check out and build, no write access.
permissions:
  contents: read

# Run a fresh job per push to the same branch and cancel any in-flight one,
# saves CI minutes during rapid iteration.
concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # OCTO-FORK: CI 守卫接线：新增 norms/brand/datapath/agents/server-diff 等 job — see dev-docs-usdable/开发规范.md §3.4
  # Guards branding/brand.json — the single source of truth for product identity
  # — and the generated copies that go:embed, Vite and Inno Setup read.
  #
  # The point is that the mistakes are caught here rather than in review: giving
  # a path or an identifier a Chinese value or a language map fails rule C, a
  # half-translated string fails rule A, and editing a generated copy instead of
  # the source shows up as drift. The scripts have no npm dependencies, so this
  # job needs no install step and finishes in seconds.
  brand-guard:
    name: Brand Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate branding/brand.json
        run: node scripts/brand-schema.mjs

      - name: Check generated brand files are in sync with the source
        run: node scripts/sync-branding.mjs --check

      # 硬规则 2's teeth: a product file that types the name instead of
      # interpolating {brand}/{brandShort}. See V-79 — before this existed the
      # job was named Brand Guard but only validated the schema.
      - name: Fail on unlicensed brand literals in source
        run: node scripts/brand-guard.mjs

      - name: Run branding pipeline tests
        run: node --test scripts/brand-schema.test.mjs scripts/sync-branding.test.mjs scripts/brand-guard.test.mjs

  # Guards the portable-data-root rule (开发规范.md §3.1): product code must
  # not write to the host home. Scans internal/, cmd/, shared/ for non-_test.go
  # Go files and fails on a ".octo" string literal (zero exceptions) or an
  # os.UserHomeDir() call outside scripts/homedir-allowlist.txt. This is the
  # safety net that catches an upstream merge silently bringing back a
  # ~/.octo write point. No npm dependencies, so no install step.
  datapath-guard:
    name: Data Path Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run datapath guard
        run: node scripts/datapath-guard.mjs

      - name: Run datapath guard tests
        run: node --test scripts/datapath-guard.test.mjs

  # OCTO-FORK: 六条守卫的 CI 接线（TODO-02 / V-1；接线位置按 archive/feat-*-guard-20260911 与
  # archive/feat-test-production-20260911 取） — see dev-docs-usdable/需求/20260911/TODO.md §TODO-02
  #
  # These four scripts existed with their unit tests and were run by
  # scripts/preflight.mjs (packaging only) — but no CI job called them, while
  # this file's own comment claimed "the guards already run as their own CI
  # jobs". That is V-1's shape: not a missing capability, a missing automatic
  # regression. Packaging is a later, different act than committing, so a rule
  # enforced only at packaging time can be violated for weeks.
  docs-table-guard:
    name: Docs Table Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run docs table guard
        run: node scripts/docs-table-guard.mjs

      - name: Run docs table guard tests
        run: node --test scripts/docs-table-guard.test.mjs

  # Guards requirement D6 / G4 (需求基线.md): the web bundle keeps a second copy
  # of the normalization symbol table (the dictionary page pre-checks duplicates
  # and emptiness without a round trip), and nothing compared the two until
  # D-010. They are equal today, so no other test would notice a drift — this is
  # the assertion, not a description of it. No npm dependencies.
  sensitive-norm-guard:
    name: Sensitive Norm Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run sensitive norm guard
        run: node scripts/sensitive-norm-guard.mjs

      - name: Run sensitive norm guard tests
        run: node --test scripts/sensitive-norm-guard.test.mjs

  reuse-guard:
    name: Reuse Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run reuse guard
        run: node scripts/reuse-guard.mjs

      - name: Run reuse guard tests
        run: node --test scripts/reuse-guard.test.mjs

  # Same two quirks as fork-marker-guard below: the guard compares against the
  # upstream-tracking branch, so `main` must exist as a ref (a PR checkout is a
  # detached merge commit), and today's fork debt is recorded as a ratchet that
  # may only shrink.
  server-diff-guard:
    name: Server Diff Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch the upstream-tracking branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run server diff guard
        run: node scripts/server-diff-guard.mjs

      - name: Run server diff guard tests
        run: node --test scripts/server-diff-guard.test.mjs

  release-profile-guard:
    name: Release Profile Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run release profile guard
        run: node scripts/release-profile-guard.mjs

      - name: Run release profile guard tests
        run: node --test scripts/release-profile-guard.test.mjs

  # The build that is actually shipped: everything compiled with the
  # product_production tag. Without the tag the developer profile is selected
  # and the release still compiles, still passes every test and still produces
  # a working binary — it just ships a developer package. cmd/octo-desktop is a
  # nested module, so it is built and tested separately.
  test-production:
    name: Production Build Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Build with the product tag
        run: go build -tags product_production ./...

      - name: Vet with the product tag
        run: go vet -tags product_production ./...

      - name: Test with the product tag
        run: go test -tags product_production ./...

      # The nested cmd/octo-desktop module is skipped by the root `go test ./...`,
      # so its product-tagged tests only run if they are invoked from inside it.
      #
      # It needs the Linux webview toolchain to build at all (CGO links GTK4 +
      # WebKitGTK 6.0 + libsoup 3.0). Wiring this job up without the deps failed
      # on the first v1 run — the archived Makefile target had only ever been
      # run on a developer machine, which already had them. Same three packages
      # desktop.yml and release.yml install, kept in step deliberately.
      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev

      - name: Test the desktop shell with the product tag
        working-directory: cmd/octo-desktop
        run: go test -tags product_production ./...

  norms-guard:
    name: Norms Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run norms guard
        run: node scripts/norms-guard.mjs

      - name: Run norms guard tests
        run: node --test scripts/norms-guard.test.mjs

  # Guards the AI-tool entry point that must carry the upstream rules *inline*
  # (开发规范 §7.4). Codex reads AGENTS.md and has no include directive, so a
  # pointer is only a request; `.octorules` is inlined verbatim to make it a
  # guarantee. This job fails when the generated file drifts, and — the case no
  # other check sees — when an upstream merge reverts the fork rules out of
  # `.octorules`, which would otherwise regenerate a compliant-looking AGENTS.md
  # with the three hard rules missing. No npm dependencies.
  agents-guard:
    name: Agents Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check AGENTS.md is in sync with .octorules
        run: node scripts/sync-agents.mjs --check

      - name: Run sync-agents tests
        run: node --test scripts/sync-agents.test.mjs

  # Guards hard rule 3 (开发规范 §3.3): every change to an upstream file carries
  # an `OCTO-FORK:` marker, and that marker list is the complete
  # diff-from-upstream inventory an upstream merge is done from. Nothing checked
  # it until 2026-09-13, by which point 250 of 318 modified upstream files had
  # no marker. Two properties are load-bearing and both are tested: the check
  # anchors on a marker LINE (a file that merely *mentions* the token — .octorules
  # and CLAUDE.md define the rule — is not marked), and a run that examined zero
  # files fails instead of reporting success (the V-49 failure mode, where a
  # guard counted a symbol that does not exist and announced the target reached).
  fork-marker-guard:
    name: Fork Marker Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The guard diffs this branch against the upstream-tracking branch, so
          # it needs more than the single-commit checkout.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Fetch the upstream-tracking branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Run fork-marker guard
        run: node scripts/fork-marker-guard.mjs

      - name: Run fork-marker guard tests
        run: node --test scripts/fork-marker-guard.test.mjs

  svelte-check:
    name: Svelte Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run svelte-check
        working-directory: web
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Run web tests
        working-directory: web
        run: npm test

  test:
    name: Go ${{ matrix.go }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        if: matrix.os != 'windows-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      # cmd/octo-desktop is a nested module replaced onto the root module, so a
      # root dependency bump can leave its go.mod untidy without any file under
      # cmd/octo-desktop changing (broke the 1.12.20 installers). tidy -diff is
      # module-graph-only — no CGO/GTK needed — so it runs here on every PR.
      - name: go mod tidy check (cmd/octo-desktop)
        if: matrix.os == 'ubuntu-latest'
        working-directory: cmd/octo-desktop
        run: go mod tidy -diff

      # The nested module is excluded from the root `go build ./...` above, and
      # desktop.yml only runs when a PR touches one of its listed paths — which
      # does not cover every root package this module imports (internal/app,
      # internal/productruntime, internal/productclient, ...). A root-only
      # change could therefore break the fork's main deliverable's compile with
      # every job here green (V-41). Windows targets need no CGO (WebView2 is
      # pure Go), so this type-check is cheap and runs on one platform; the
      # five-platform build matrix still lives in desktop.yml.
      - name: go build (cmd/octo-desktop, nested module)
        if: matrix.os == 'ubuntu-latest'
        working-directory: cmd/octo-desktop
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...

      # Data races are OS-independent, so the detector only runs on ubuntu (where
      # it's cheapest). Windows/macOS run a plain `go test` — fast, and still
      # catches platform-specific failures (path handling, process spawning, the
      # GOOS-guarded cases). The race pass on Windows was the CI bottleneck
      # (~150s of a ~220s job) thanks to instrumentation + costly process spawns.
      # -timeout 20m: the browser package launches a real Chrome per test and
      # already runs ~6-8min on a starved windows-latest runner; with the
      # deliberately generous per-test ceilings (see internal/browser
      # testWaitTimeout) a bad-weather run must fail those tests cleanly
      # instead of hitting the go-test default 10m panic.
      - name: go test
        if: matrix.os != 'windows-latest'
        run: go test -timeout 20m ${{ matrix.os == 'ubuntu-latest' && '-race' || '' }} ./...

      # Windows runs internal/browser on its own. `go test ./...` runs up to
      # GOMAXPROCS package test binaries at once, and on the 4-core
      # windows-latest runner the browser tests' headless Chrome shared the
      # machine with internal/tools (~3-5min) and internal/server. Under that
      # load, three different browser tests failed in one day (2026-09-04) on
      # ceilings that are already 60-90s — a first fixture page not rendering in
      # 60s, a local download not starting in 30s — while the same commit passed
      # on rerun once the neighbours had thinned out (browser package 528s in
      # the failing run vs 314s in the passing one). Giving Chrome the whole
      # runner removes the contention instead of chasing each ceiling upward.
      - name: go test (all but internal/browser)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test -timeout 20m $(go list ./... | grep -v '/internal/browser$')

      - name: go test (internal/browser, alone)
        if: matrix.os == 'windows-latest'
        run: go test -timeout 20m ./internal/browser/
